
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishEatLaek - กินเอาตาย</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="game-shell">

    <!-- HOME SCREEN -->
    <section class="screen active" id="homeScreen">

        <header class="game-header">
            <h1>EnglishEatLaek</h1>
            <p>กินเอาตาย</p>
        </header>

        <div class="artwork-placeholder home-art">
            <strong>CHARACTER ARTWORK</strong>
            <span>PLACEHOLDER AREA</span>
        </div>

        <div class="home-actions">

            <button class="game-button primary" id="startButton">
                START
            </button>

            <nav class="quick-menu">
                <button class="round-button" data-modal="helpModal">?</button>
                <button class="round-button" data-modal="scoreModal">123</button>
                <button class="round-button" data-modal="powerModal">ϟ</button>
                <button class="round-button" id="soundButton">♫</button>
                <button class="round-button" data-modal="settingsModal">⚙</button>
            </nav>

        </div>

        <footer>VERSION 1.0 • LEARN & SURVIVE</footer>

    </section>


    <!-- GAMEPLAY SCREEN -->
    <section class="screen" id="gameScreen">

        <div class="hud">

            <div class="hud-score">
                <span>★</span>
                <b id="scoreValue">10</b>
            </div>

            <div class="hud-ammo">
                <span>▰</span>
                <b id="ammoValue">3</b>
            </div>

            <button class="pause-button" id="pauseButton">
                Ⅱ
            </button>

        </div>

        <div class="artwork-placeholder gameplay-art">
            <strong>GAMEPLAY ARTWORK AREA</strong>
            <span>
                Character, zombies and background<br>
                will be added by teammate
            </span>
        </div>

        <div class="game-controls">

            <button class="text-control" id="moveButton">
                MOVE
            </button>

            <button class="game-button secondary" id="continueButton">
                CONTINUE
            </button>

            <button class="text-control" id="shootButton">
                SHOOT ⦿
            </button>

        </div>

    </section>


    <!-- CONFIRMATION SCREEN -->
    <section class="screen confirmation-screen" id="confirmationScreen">

        <div class="artwork-placeholder confirmation-backdrop">
            <strong>GAMEPLAY BACKDROP</strong>
            <span>Artwork placeholder</span>
        </div>

        <div class="dialog">

            <h2>CONSIDER</h2>

            <p>
                Do you want to use 3 bullets<br>
                to continue?
            </p>

            <div class="dialog-actions">

                <button class="game-button yes-button" id="yesButton">
                    YES
                </button>

                <button class="game-button no-button" id="noButton">
                    NO
                </button>

            </div>

        </div>

    </section>


    <!-- MENU MODAL -->
    <div class="modal-backdrop" id="menuModal" hidden>

        <section class="small-modal">

            <button class="modal-close" id="closeModal">×</button>

            <h2 id="modalTitle">MENU</h2>

            <p id="modalText"></p>

        </section>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
